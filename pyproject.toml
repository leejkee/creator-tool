[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-create-tool"
version = "0.0.1"
description = "Local PySide6 guide editor with a shared Pillow renderer"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
guide-editor = "image_create_tool.cli:main"

[tool.setuptools.packages.find]
include = ["image_create_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

