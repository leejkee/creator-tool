[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-create-tool"
version = "0.1.0"
description = "Local PySide6 image editor with a Pillow renderer"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.gui-scripts]
guide-editor = "image_create_tool.gui:main"

[tool.setuptools.packages.find]
include = ["image_create_tool*"]
namespaces = false

[tool.setuptools.package-data]
image_create_tool = ["resources/*", "resources/styles/*.json", "resources/templates/*.json", "resources/scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

