name: Desktop checks

on:
  push:
    branches:
      - "**"
    paths:
      - "desktop/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check when called by the release workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

  rust:
    name: Windows Rust checks
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: windows-x64
      - run: cargo fmt -- --check
      - run: cargo check --locked
      - run: cargo clippy --locked --lib -- -D warnings
